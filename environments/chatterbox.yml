name: chatterbox
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy<2.0.0
  - torchaudio
  - python-sounddevice
  - soundfile
  - fastapi
  - uvicorn
  - pip:
      - chatterbox-tts==0.1.7
      - resemble-perth==1.0.1
      - s3tokenizer==0.3.0
      - conformer==0.3.2
      - pykakasi==2.3.0
      - pyloudnorm==0.2.0
